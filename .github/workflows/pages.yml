name: Deploy the web viewer

# Builds the wasm viewer and publishes it to the `gh-pages` branch, which
# GitHub Pages serves. Push to main and the live site follows.
#
# Why the branch and not `actions/deploy-pages`: this repository's Pages source
# is "Deploy from a branch". The artifact route only works when the source is
# set to "GitHub Actions", and if the two are mismatched the deploy step fails
# with an error that reads like a permissions problem. Pushing a branch works
# under either setting, so it is the one that cannot be silently wrong.
#
# The scene it serves, web/de_nuke.plant.nkp.gz, is committed — the build
# cannot regenerate it, because that needs a Counter-Strike 2 installation and
# this runner has none. See NOTICE.md for what that file is and is not.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two at once, and never cancel one half-done: an interrupted deploy
# leaves the site serving a wasm that does not match its JS glue.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Check the scene is there
        run: |
          test -f web/de_nuke.plant.nkp.gz || {
            echo "::error::web/de_nuke.plant.nkp.gz is missing — the page would load to a black screen."
            echo "Regenerate it on a machine with CS2 installed:"
            echo "  cargo run --release -p view --bin nukeplant -- \\"
            echo "    --keep pipe,duct,vessel,machinery,instrument,electrical,glass,structure,access,other \\"
            echo "    --export-web web/de_nuke.plant.nkp && gzip -9 web/de_nuke.plant.nkp"
            exit 1
          }

      # Rust bakes source paths into panic messages, including the build
      # machine's Cargo registry. Unremapped, a wasm built on a laptop ships
      # that account name to every visitor. Remap them to neutral roots.
      - name: Build
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/nukeplant
            --remap-path-prefix=/home/runner/.cargo=/cargo
        run: cargo build --release --target wasm32-unknown-unknown -p view --lib

      # The CLI and the crate must be the same version or the generated glue
      # will not match the wasm. Read the version out of the lockfile rather
      # than pinning it in two places.
      - name: Install wasm-bindgen-cli matching the lockfile
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen $version"
          if [ "$(wasm-bindgen --version 2>/dev/null | cut -d' ' -f2)" != "$version" ]; then
            cargo install -f wasm-bindgen-cli --version "$version"
          fi

      - name: Generate bindings
        run: |
          wasm-bindgen --target web --no-typescript \
            --out-dir web/pkg \
            target/wasm32-unknown-unknown/release/plant.wasm

      # A wasm built without the remapping above, or by hand on someone's
      # laptop, carries a home directory in it. This is published to the open
      # internet, so check rather than trust.
      - name: Refuse to publish a build with a home directory in it
        run: |
          if grep -a -q -E 'C:\\Users\\|/home/[a-z]|/Users/[a-z]' web/pkg/plant_bg.wasm; then
            echo "::error::The wasm contains build-machine paths. Something built it"
            echo "::error::without --remap-path-prefix. Offending strings:"
            grep -a -o -E '(C:\\Users\\|/home/|/Users/)[^ ]{0,40}' web/pkg/plant_bg.wasm | sort -u | head
            exit 1
          fi
          echo "no build-machine paths in the wasm"

      - name: Publish to gh-pages
        run: |
          # `.nojekyll` stops Pages running the site through Jekyll, which it
          # does not need and which would slow every deploy down.
          touch web/.nojekyll
          cd web
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built from ${GITHUB_SHA::7}"
          # Force: this branch is build output, and its history is worth
          # nothing next to keeping the clone small.
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
